<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="帕帕韦斯特雷共和国 · 账户登录与注册">
    <meta name="author" content="PPW 技术部">
    <title>账户 · 帕帕韦斯特雷共和国</title>

    <link rel="icon" type="image/svg+xml" href="./rpw.svg">

    <!-- 主题预设：避免闪烁 -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem('ppw_theme');
                var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = t || (sysDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #1a3550;
            --color-primary-light: #234b6e;
            --color-primary-dark: #0f2235;
            --color-gold: #b8944b;
            --color-gold-light: #d4b76a;
            --color-gold-pale: #f5eedc;
            --color-white: #ffffff;
            --color-bg: #f8f7f4;
            --color-bg-alt: #eef0f2;
            --color-text: #2c2c2c;
            --color-text-light: #5a5a5a;
            --color-text-muted: #888888;
            --color-border: #e0ddd6;
            --color-nav-bg: rgba(26,53,80,0.97);
            --color-nav-bg-scrolled: rgba(26,53,80,0.99);
            --color-success: #3a7d5a;
            --color-error: #b04a4a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.05);
            --shadow-xl: 0 20px 48px rgba(0,0,0,0.12), 0 8px 20px rgba(0,0,0,0.06);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --max-width: 1200px;
            --nav-height: 70px;
        }

        html[data-theme="dark"] {
            --color-primary: #7ba8d0;
            --color-primary-light: #9cc0e0;
            --color-primary-dark: #5a8ab0;
            --color-gold: #d4b76a;
            --color-gold-light: #e0c880;
            --color-gold-pale: #2a2519;
            --color-white: #1a2332;
            --color-bg: #0f1621;
            --color-bg-alt: #1a2332;
            --color-text: #e0e0e0;
            --color-text-light: #a8a8a8;
            --color-text-muted: #6a6a6a;
            --color-border: #2d3748;
            --color-nav-bg: rgba(10,15,22,0.97);
            --color-nav-bg-scrolled: rgba(10,15,22,0.99);
            --color-success: #34d399;
            --color-error: #f87171;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.2);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.25);
            --shadow-xl: 0 20px 48px rgba(0,0,0,0.45), 0 8px 20px rgba(0,0,0,0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; scroll-padding-top:var(--nav-height); font-size:16px; -webkit-font-smoothing:antialiased; }
        body {
            font-family: 'Noto Sans SC','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            color:var(--color-text); background-color:var(--color-bg);
            line-height:1.7; overflow-x:hidden; min-height:100vh;
            display:flex; flex-direction:column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1,h2,h3,h4 { font-family:'Playfair Display','Noto Sans SC','Noto Serif SC',Georgia,'Times New Roman',serif; font-weight:600; letter-spacing:0.02em; }

        /* ===== 导航栏 ===== */
        .navbar {
            position:fixed; top:0; left:0; width:100%; height:var(--nav-height);
            background:var(--color-nav-bg); backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px); z-index:1000;
            border-bottom:1px solid rgba(255,255,255,0.08);
            transition:all var(--transition-normal); display:flex; align-items:center;
            box-shadow:0 2px 20px rgba(0,0,0,0.15);
        }
        .navbar.scrolled { height:58px; background:var(--color-nav-bg-scrolled); box-shadow:0 4px 24px rgba(0,0,0,0.2); }
        .nav-container {
            max-width:var(--max-width); width:100%; margin:0 auto;
            padding:0 24px; display:flex; align-items:center; justify-content:space-between;
            gap: 12px;
        }
        .nav-brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--color-white); }
        .nav-brand img { width:85.5px; height:37.5px; transition:transform var(--transition-normal); }
        .nav-brand:hover img { transform:rotate(-8deg) scale(1.05); }
        .brand-text { display:flex; flex-direction:column; line-height:1.2; }
        .brand-title { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700; letter-spacing:0.03em; }
        .brand-subtitle { font-size:0.65rem; font-weight:300; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-gold-light); }
        .nav-links { display:flex; list-style:none; gap:4px; align-items:center; }
        .nav-links a {
            display:block; padding:8px 16px; text-decoration:none;
            color:rgba(255,255,255,0.85); font-size:0.9rem; font-weight:400;
            letter-spacing:0.03em; border-radius:var(--radius-sm);
            transition:all var(--transition-fast); position:relative; white-space:nowrap;
        }
        .nav-links a:hover,.nav-links a.active { color:#fff; background:rgba(255,255,255,0.08); }
        .nav-links a::after {
            content:''; position:absolute; bottom:4px; left:50%;
            transform:translateX(-50%) scaleX(0); width:60%; height:2px;
            background:var(--color-gold); border-radius:1px;
            transition:transform var(--transition-normal);
        }
        .nav-links a:hover::after,.nav-links a.active::after { transform:translateX(-50%) scaleX(1); }

        /* 主题切换按钮 */
        .theme-toggle {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--color-gold-light);
            transition: all var(--transition-fast);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.3);
            transform: rotate(15deg) scale(1.05);
        }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            display: none;
        }
        html[data-theme="light"] .theme-toggle .icon-moon { display: block; }
        html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

        .nav-toggle { display:none; background:none; border:none; cursor:pointer; padding:8px; flex-direction:column; gap:5px; z-index:1001; }
        .nav-toggle span { display:block; width:26px; height:2.5px; background:var(--color-white); border-radius:2px; transition:all var(--transition-normal); }
        .nav-toggle.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
        .nav-toggle.active span:nth-child(2) { opacity:0; }
        .nav-toggle.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

        /* ===== 主内容 ===== */
        .main {
            flex:1; padding-top: var(--nav-height);
            max-width: var(--max-width); margin: 0 auto; width: 100%;
            padding-left: 24px; padding-right: 24px; padding-bottom: 60px;
        }

        .page-header { text-align:center; margin:50px 0 30px; }
        .page-header .section-label {
            display:inline-block; font-size:0.75rem; font-weight:600; letter-spacing:0.1em;
            text-transform:uppercase; color:var(--color-gold); margin-bottom:8px;
            padding:4px 14px; border:1px solid var(--color-gold); border-radius:50px;
        }
        .page-header h1 { font-size:clamp(2rem,4vw,2.8rem); color:var(--color-primary); margin-bottom:12px; font-weight:700; }
        .page-header .divider { width:60px; height:3px; background:var(--color-gold); margin:0 auto 16px; border-radius:2px; }
        .page-header p { color:var(--color-text-light); max-width:600px; margin:0 auto; font-size:0.95rem; line-height:1.8; }

        /* ===== 认证卡片 ===== */
        .auth-card {
            max-width: 480px; margin: 0 auto;
            background: var(--color-white);
            border-radius: var(--radius-lg);
            padding: 36px 40px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--color-border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Tab 切换 */
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            background: var(--color-bg);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid var(--color-border);
        }
        .auth-tab {
            flex: 1;
            padding: 10px 16px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            border-radius: 50px;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--color-text-light);
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .auth-tab.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }
        .auth-tab:hover:not(.active) {
            color: var(--color-primary);
        }

        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
            transition: all var(--transition-fast);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--color-gold);
            box-shadow: 0 0 0 3px rgba(184,148,75,0.15);
            background: var(--color-white);
        }

        .form-submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-family: inherit;
            margin-top: 8px;
        }
        .form-submit-btn:hover {
            background: var(--color-primary-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .form-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-msg {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            line-height: 1.5;
            display: none;
        }
        .form-msg.error {
            display: block;
            background: rgba(176,74,74,0.1);
            color: var(--color-error);
            border: 1px solid rgba(176,74,74,0.25);
        }
        .form-msg.success {
            display: block;
            background: rgba(58,125,90,0.1);
            color: var(--color-success);
            border: 1px solid rgba(58,125,90,0.25);
        }

        /* 已登录状态 */
        .user-panel {
            display: none;
            text-align: center;
        }
        .user-panel.active { display: block; animation: fadeIn 0.3s ease; }
        .user-panel .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--color-gold-pale);
            color: var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 16px;
            border: 2px solid var(--color-gold);
        }
        .user-panel .email {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
            word-break: break-all;
        }
        .user-panel .status {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 24px;
        }
        .user-panel .btn-logout {
            padding: 12px 32px;
            background: transparent;
            color: var(--color-error);
            border: 2px solid var(--color-error);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-family: inherit;
        }
        .user-panel .btn-logout:hover {
            background: var(--color-error);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ===== 页脚 ===== */
        .site-footer { background:var(--color-primary-dark); color:rgba(255,255,255,0.7); padding:32px 24px 24px; margin-top:auto; }
        .footer-bottom { max-width:var(--max-width); margin:0 auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1); text-align:center; font-size:0.78rem; color:rgba(255,255,255,0.4); letter-spacing:0.04em; }

        @media (max-width:768px) {
            .nav-toggle { display:flex; }
            .nav-links {
                position:fixed; top:0; right:-100%; width:75%; max-width:320px; height:100vh;
                background:var(--color-primary); flex-direction:column; padding:90px 24px 40px;
                gap:4px; transition:right var(--transition-slow);
                box-shadow:-8px 0 30px rgba(0,0,0,0.3); z-index:1000;
            }
            .nav-links.open { right:0; }
            .nav-links a { font-size:1rem; padding:14px 16px; width:100%; border-radius:var(--radius-md); }
            .main { padding-left:16px; padding-right:16px; }
            .auth-card { padding: 28px 22px; }
        }
        @media (max-width:480px) {
            .auth-card { padding: 24px 18px; }
        }

        .fade-in-up { opacity:0; transform:translateY(30px); transition:opacity 0.7s ease, transform 0.7s ease; }
        .fade-in-up.visible { opacity:1; transform:translateY(0); }
        .nav-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; }
        .nav-overlay.active { display:block; }
    </style>
</head>

    <!-- ==================== Supabase SDK ==================== -->
    <script type="module">
        // ========== 请替换为您的 Supabase 项目信息 ==========
        const SUPABASE_URL = 'https://dfuwrvovcubjwytzpnby.supabase.co/';
        const SUPABASE_ANON_KEY = 'sb_publishable_MmVwBMhgOAkBI-R0SD-03g_Z4bzxr52';
        // ===================================================

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 主题切换 ==========
        const themeToggle = document.getElementById('themeToggle');
        const htmlEl = document.documentElement;
        function getPreferredTheme() {
            try {
                const saved = localStorage.getItem('ppw_theme');
                if (saved === 'dark' || saved === 'light') return saved;
            } catch (e) {}
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
        }
        themeToggle.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem('ppw_theme', next); } catch (e) {}
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            try {
                if (!localStorage.getItem('ppw_theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            } catch (err) {}
        });
        applyTheme(getPreferredTheme());

        // ========== DOM 引用 ==========
        const authForms = document.getElementById('authForms');
        const userPanel = document.getElementById('userPanel');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginMsg = document.getElementById('loginMsg');
        const signupMsg = document.getElementById('signupMsg');
        const logoutMsg = document.getElementById('logoutMsg');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');

        // ========== Tab 切换 ==========
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                document.getElementById(target + 'Form').classList.add('active');
                // 清空消息
                loginMsg.className = 'form-msg';
                signupMsg.className = 'form-msg';
                loginMsg.textContent = '';
                signupMsg.textContent = '';
            });
        });

        // ========== 显示消息 ==========
        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'form-msg ' + type;
        }

        // ========== 检查会话 ==========
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                showUser(session.user);
            } else {
                showAuth();
            }
        }

        function showUser(user) {
            authForms.style.display = 'none';
            userPanel.classList.add('active');
            userEmail.textContent = user.email;
        }

        function showAuth() {
            authForms.style.display = 'block';
            userPanel.classList.remove('active');
        }

        // ========== 注册 ==========
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (password.length < 6) {
                showMsg(signupMsg, '密码长度至少为 6 位。', 'error');
                return;
            }
            if (password !== confirm) {
                showMsg(signupMsg, '两次输入的密码不一致。', 'error');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = '注册中…';
            showMsg(signupMsg, '', '');

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + '/auth.html'
                }
            });

            if (error) {
                showMsg(signupMsg, '注册失败：' + error.message, 'error');
                signupBtn.disabled = false;
                signupBtn.textContent = '注册';
                return;
            }

            // 如果 Supabase 开启了邮箱确认，此时 user 可能为 null（等待确认）
            if (data.user && data.session) {
                showMsg(signupMsg, '注册成功！已自动登录。', 'success');
                setTimeout(() => {
                    showUser(data.user);
                }, 800);
            } else {
                showMsg(signupMsg, '注册成功！请检查邮箱完成确认，然后登录。', 'success');
            }
            signupBtn.disabled = false;
            signupBtn.textContent = '注册';
        });

        // ========== 登录 ==========
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中…';
            showMsg(loginMsg, '', '');

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showMsg(loginMsg, '登录失败：' + error.message, 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
                return;
            }

            showMsg(loginMsg, '登录成功！', 'success');
            setTimeout(() => {
                showUser(data.user);
            }, 500);
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        });

        // ========== 退出登录 ==========
        logoutBtn.addEventListener('click', async () => {
            logoutBtn.disabled = true;
            logoutBtn.textContent = '退出中…';
            await supabase.auth.signOut();
            logoutBtn.disabled = false;
            logoutBtn.textContent = '退出登录';
            showAuth();
            // 清空表单
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('signupEmail').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirm').value = '';
            // 显示退出消息
            logoutMsg.className = 'form-msg success';
            logoutMsg.textContent = '您已成功退出。';
            setTimeout(() => {
                logoutMsg.className = 'form-msg';
                logoutMsg.textContent = '';
            }, 3000);
        });

        // ========== 监听认证状态变化 ==========
        supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                showUser(session.user);
            } else {
                showAuth();
            }
        });

        // ========== 导航栏交互 ==========
        const navbar = document.getElementById('navbar');
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        const navOverlay = document.getElementById('navOverlay');

        function updateNavbar() {
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        }
        window.addEventListener('scroll', updateNavbar, { passive: true });

        navToggle.addEventListener('click', () => {
            navLinks.classList.contains('open') ? closeMobileNav() : openMobileNav();
        });
        navOverlay.addEventListener('click', closeMobileNav);
        function openMobileNav() {
            navLinks.classList.add('open');
            navOverlay.classList.add('active');
            navToggle.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeMobileNav() {
            navLinks.classList.remove('open');
            navOverlay.classList.remove('active');
            navToggle.classList.remove('active');
            document.body.style.overflow = '';
        }
        navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileNav));

        // 淡入
        const fadeElements = document.querySelectorAll('.fade-in-up');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        fadeElements.forEach(el => observer.observe(el));

        // 启动
        updateNavbar();
        checkSession();
    </script>
</body>
</html>
