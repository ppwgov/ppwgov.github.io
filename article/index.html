<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="帕帕韦斯特雷共和国文章列表 - 官方文献与思想库">
    <meta name="author" content="PPW 技术部">
    <title>文章列表 · 帕帕韦斯特雷共和国</title>

    <link rel="icon" type="image/png" href="rpw.png">
    <link rel="icon" type="image/svg+xml" href="rpw.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #1a3550;
            --color-primary-light: #234b6e;
            --color-primary-dark: #0f2235;
            --color-gold: #b8944b;
            --color-gold-light: #d4b76a;
            --color-gold-pale: #f5eedc;
            --color-white: #ffffff;
            --color-bg: #f8f7f4;
            --color-bg-alt: #eef0f2;
            --color-text: #2c2c2c;
            --color-text-light: #5a5a5a;
            --color-text-muted: #888888;
            --color-border: #e0ddd6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.05);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --max-width: 1200px;
            --nav-height: 70px;
            --sidebar-width: 220px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; scroll-padding-top:var(--nav-height); font-size:16px; -webkit-font-smoothing:antialiased; }
        body {
            font-family: 'Noto Sans SC','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            color:var(--color-text); background-color:var(--color-bg);
            line-height:1.7; overflow-x:hidden; min-height:100vh;
            display:flex; flex-direction:column;
        }
        h1,h2,h3,h4 { font-family:'Playfair Display','Noto Sans SC','Noto Serif SC',Georgia,'Times New Roman',serif; font-weight:600; letter-spacing:0.02em; }

        /* ===== 导航栏 ===== */
        .navbar {
            position:fixed; top:0; left:0; width:100%; height:var(--nav-height);
            background:rgba(26,53,80,0.97); backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px); z-index:1000;
            border-bottom:1px solid rgba(255,255,255,0.08);
            transition:all var(--transition-normal); display:flex; align-items:center;
            box-shadow:0 2px 20px rgba(0,0,0,0.15);
        }
        .navbar.scrolled { height:58px; background:rgba(26,53,80,0.99); box-shadow:0 4px 24px rgba(0,0,0,0.2); }
        .nav-container {
            max-width:var(--max-width); width:100%; margin:0 auto;
            padding:0 24px; display:flex; align-items:center; justify-content:space-between;
        }
        .nav-brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--color-white); }
        .nav-brand img { width:85.5px; height:37.5px; transition:transform var(--transition-normal); }
        .nav-brand:hover img { transform:rotate(-8deg) scale(1.05); }
        .brand-text { display:flex; flex-direction:column; line-height:1.2; }
        .brand-title { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700; letter-spacing:0.03em; }
        .brand-subtitle { font-size:0.65rem; font-weight:300; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-gold-light); }
        .nav-links { display:flex; list-style:none; gap:4px; align-items:center; }
        .nav-links a {
            display:block; padding:8px 16px; text-decoration:none;
            color:rgba(255,255,255,0.85); font-size:0.9rem; font-weight:400;
            letter-spacing:0.03em; border-radius:var(--radius-sm);
            transition:all var(--transition-fast); position:relative; white-space:nowrap;
        }
        .nav-links a:hover,.nav-links a.active { color:#fff; background:rgba(255,255,255,0.08); }
        .nav-links a::after {
            content:''; position:absolute; bottom:4px; left:50%;
            transform:translateX(-50%) scaleX(0); width:60%; height:2px;
            background:var(--color-gold); border-radius:1px;
            transition:transform var(--transition-normal);
        }
        .nav-links a:hover::after,.nav-links a.active::after { transform:translateX(-50%) scaleX(1); }

        .nav-toggle { display:none; background:none; border:none; cursor:pointer; padding:8px; flex-direction:column; gap:5px; z-index:1001; }
        .nav-toggle span { display:block; width:26px; height:2.5px; background:var(--color-white); border-radius:2px; transition:all var(--transition-normal); }
        .nav-toggle.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
        .nav-toggle.active span:nth-child(2) { opacity:0; }
        .nav-toggle.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

        /* ===== 主内容 ===== */
        .main {
            flex:1;
            padding-top: var(--nav-height);
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 60px;
        }

        .page-header { text-align:center; margin:60px 0 40px; }
        .page-header .section-label {
            display:inline-block; font-size:0.75rem; font-weight:600; letter-spacing:0.1em;
            text-transform:uppercase; color:var(--color-gold); margin-bottom:8px;
            padding:4px 14px; border:1px solid var(--color-gold); border-radius:50px;
        }
        .page-header h1 { font-size:clamp(2rem,4vw,2.8rem); color:var(--color-primary); margin-bottom:12px; font-weight:700; }
        .page-header .divider { width:60px; height:3px; background:var(--color-gold); margin:0 auto 16px; border-radius:2px; }
        .page-header p { color:var(--color-text-light); max-width:600px; margin:0 auto; font-size:0.95rem; line-height:1.8; }

        /* ===== 双栏布局 ===== */
        .content-layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            gap: 40px;
            align-items: start;
        }

        /* 搜索框*/
        .filter-bar {
		    display: flex;
		    flex-direction: column;
		    gap: 20px;
		    margin-bottom: 40px;
		}
		.search-box {
		    position: relative;
		    max-width: 1200px;
		    margin: 0 auto;
		    width: 100%;
		}
		.search-box input {
		    width: 100%;
		    padding: 12px 44px 12px 18px;
		    border: 1.5px solid var(--color-border);
		    border-radius: 50px;
		    font-size: 0.95rem;
		    font-family: inherit;
		    background: var(--color-white);
		    transition: all var(--transition-fast);
		    outline: none;
		}
		.search-box input:focus {
		    border-color: var(--color-gold);
		    box-shadow: 0 0 0 3px rgba(184,148,75,0.15);
		}
		.search-box .search-icon {
		    position: absolute;
		    right: 16px;
		    top: 50%;
		    transform: translateY(-50%);
		    color: var(--color-text-muted);
		    font-size: 1.1rem;
		}

        /* 左侧栏 */
        .sidebar {
		    position: sticky;
		    top: calc(var(--nav-height) + 20px);
		}

        .sidebar-title {
            font-family:'Playfair Display',serif;
            font-size:0.8rem; font-weight:700;
            color:var(--color-primary);
            letter-spacing:0.1em;
            text-transform:uppercase;
            margin-bottom:14px;
            padding-bottom:10px;
            border-bottom:1px solid var(--color-border);
        }

        .tags-container {
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .tag-btn {
            width:100%;
            padding:9px 16px;
            border-radius:50px;
            border:1px solid var(--color-border);
            background:var(--color-white);
            color:var(--color-text);
            font-size:0.85rem;
            cursor:pointer;
            transition:all var(--transition-fast);
            font-family:inherit;
            letter-spacing:0.02em;
            text-align:left;
        }
        .tag-btn:hover {
            border-color:var(--color-gold);
            color:var(--color-primary);
            transform:translateX(3px);
        }
        .tag-btn.active {
            background:var(--color-gold);
            color:var(--color-primary-dark);
            border-color:var(--color-gold);
            font-weight:600;
        }

        /* 右侧文章区 */
        .article-area { min-width: 0; }

        .result-info {
            font-size:0.85rem; color:var(--color-text-muted);
            margin-bottom:20px; letter-spacing:0.03em;
        }

        .articles-list { display:grid; grid-template-columns:1fr; gap:20px; }
        .article-card {
            background:var(--color-white); border-radius:var(--radius-lg); padding:24px 28px;
            box-shadow:var(--shadow-sm); border:1px solid var(--color-border);
            transition:all var(--transition-normal); display:block; text-decoration:none; color:inherit;
        }
        .article-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--color-gold); }
        .article-card h3 { font-size:1.3rem; color:var(--color-primary); margin-bottom:6px; font-weight:700; line-height:1.4; }
        .article-card .subtitle { font-size:0.92rem; color:var(--color-text-light); line-height:1.7; margin-bottom:12px; }
        .article-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:0.78rem; color:var(--color-text-muted); }
        .article-meta .tag { background:var(--color-gold-pale); color:var(--color-gold); padding:3px 11px; border-radius:50px; font-weight:500; }
        .article-meta .date { letter-spacing:0.03em; }

        .no-result { text-align:center; padding:60px 20px; color:var(--color-text-muted); font-size:1.05rem; display:none; }

        /* ===== 分页 ===== */
        .pagination { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:40px; flex-wrap:wrap; }
        .page-btn {
            min-width:40px; height:40px; padding:0 12px; border-radius:var(--radius-md);
            border:1px solid var(--color-border); background:var(--color-white); color:var(--color-text);
            font-size:0.9rem; cursor:pointer; transition:all var(--transition-fast);
            font-family:inherit; display:flex; align-items:center; justify-content:center; line-height:1;
        }
        .page-btn:hover:not(:disabled):not(.active) { border-color:var(--color-gold); color:var(--color-primary); background:var(--color-gold-pale); }
        .page-btn.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); font-weight:600; }
        .page-btn:disabled { opacity:0.4; cursor:not-allowed; }
        .page-btn.arrow { font-size:1rem; }
        .page-ellipsis { color:var(--color-text-muted); padding:0 4px; user-select:none; }

        /* ===== 页脚 ===== */
        .site-footer { background:var(--color-primary-dark); color:rgba(255,255,255,0.7); padding:32px 24px 24px; margin-top:auto; }
        .footer-bottom { max-width:var(--max-width); margin:0 auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1); text-align:center; font-size:0.78rem; color:rgba(255,255,255,0.4); letter-spacing:0.04em; }
        .back-to-top {
            position:fixed; bottom:28px; right:28px; width:44px; height:44px; border-radius:50%;
            background:var(--color-primary); color:#fff; border:none; cursor:pointer; z-index:999;
            font-size:1.2rem; display:flex; align-items:center; justify-content:center;
            box-shadow:var(--shadow-lg); transition:all var(--transition-normal);
            opacity:0; transform:translateY(20px); pointer-events:none; line-height:1; padding:0;
        }
        .back-to-top.visible { opacity:1; transform:translateY(0); pointer-events:auto; }
        .back-to-top:hover { background:var(--color-gold); color:var(--color-primary-dark); transform:translateY(-4px); }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .content-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .sidebar {
                position: static;
            }
            .tags-container {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }
            .tag-btn {
                width: auto;
                padding: 7px 16px;
                font-size: 0.82rem;
            }
            .tag-btn:hover { transform: none; }
        }
        @media (max-width:768px) {
            .nav-toggle { display:flex; }
            .nav-links {
                position:fixed; top:0; right:-100%; width:75%; max-width:320px; height:100vh;
                background:var(--color-primary); flex-direction:column; padding:90px 24px 40px;
                gap:4px; transition:right var(--transition-slow);
                box-shadow:-8px 0 30px rgba(0,0,0,0.3); z-index:1000;
            }
            .nav-links.open { right:0; }
            .nav-links a { font-size:1rem; padding:14px 16px; width:100%; border-radius:var(--radius-md); }
            .main { padding-left:16px; padding-right:16px; }
            .article-card { padding:20px 18px; }
            .article-card h3 { font-size:1.15rem; }
            .page-header { margin:40px 0 30px; }
        }
        @media (max-width:480px) {
            .tag-btn { padding:6px 14px; font-size:0.8rem; }
            .page-btn { min-width:36px; height:36px; padding:0 8px; font-size:0.85rem; }
        }

        .fade-in-up { opacity:0; transform:translateY(30px); transition:opacity 0.7s ease, transform 0.7s ease; }
        .fade-in-up.visible { opacity:1; transform:translateY(0); }
        .nav-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; }
        .nav-overlay.active { display:block; }
    </style>
</head>
<body>

        <div class="nav-container">

            </a>
            <ul class="nav-links" id="navLinks">

                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-overlay" id="navOverlay"></div>

    <main class="main">
        <div class="page-header fade-in-up">
            <span class="section-label">思想库</span>
            <h1>文章列表</h1>
            <div class="divider"></div>
            <p>收录共和国公民的深思与记录，涵盖政治、文化、科技与日常。</p>
        </div>

        <!-- 搜索框：居中，位于标签栏上方 -->
        <div class="filter-bar fade-in-up">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索文章标题或副标题...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div class="content-layout">
            <!-- 左侧栏：仅标签 -->
            <aside class="sidebar fade-in-up">
                <div class="sidebar-title">标签</div>
                <div class="tags-container" id="tagsContainer">
                    <button class="tag-btn active" data-tag="all">全部</button>
                </div>
            </aside>

            <!-- 右侧：文章列表 -->
            <div class="article-area">
                <div class="result-info" id="resultInfo"></div>
                <div class="articles-list" id="articlesList"></div>
                <div class="no-result" id="noResult">没有找到匹配的文章。</div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Papa Westray Government. All rights not reserved.</p>
            <p style="margin-top:4px;">文章列表 · 思想库</p>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop">↑</button>

    <script src="./articles.js"></script>

    <script>
        (function() {
            const articlesData = ARTICLES_DATA;

            const ARTICLES_PER_PAGE = 10;

            const navbar = document.getElementById('navbar');
            const navToggle = document.getElementById('navToggle');
            const navLinks = document.getElementById('navLinks');
            const navOverlay = document.getElementById('navOverlay');
            const backToTop = document.getElementById('backToTop');
            const searchInput = document.getElementById('searchInput');
            const tagsContainer = document.getElementById('tagsContainer');
            const articlesList = document.getElementById('articlesList');
            const noResult = document.getElementById('noResult');
            const pagination = document.getElementById('pagination');
            const resultInfo = document.getElementById('resultInfo');
            const fadeElements = document.querySelectorAll('.fade-in-up');

            let currentPage = 1;
            let activeTag = 'all';
            let searchText = '';

            const allTags = [...new Set(articlesData.flatMap(a => a.tags))];

            function renderTags() {
                tagsContainer.innerHTML = '<button class="tag-btn active" data-tag="all">全部</button>';
                allTags.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = 'tag-btn';
                    btn.dataset.tag = tag;
                    btn.textContent = tag;
                    tagsContainer.appendChild(btn);
                });
            }

            function getFilteredArticles() {
                const normalizedText = searchText.trim().toLowerCase();
                return articlesData.filter(article => {
                    const matchTag = activeTag === 'all' || article.tags.includes(activeTag);
                    const matchText = normalizedText === '' ||
                        article.title.toLowerCase().includes(normalizedText) ||
                        article.subtitle.toLowerCase().includes(normalizedText);
                    return matchTag && matchText;
                });
            }

            function renderArticles() {
                const filtered = getFilteredArticles();
                const totalPages = Math.ceil(filtered.length / ARTICLES_PER_PAGE);

                if (currentPage > totalPages) currentPage = totalPages || 1;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * ARTICLES_PER_PAGE;
                const end = start + ARTICLES_PER_PAGE;
                const pageArticles = filtered.slice(start, end);

                if (filtered.length === 0) {
                    resultInfo.textContent = '';
                    articlesList.innerHTML = '';
                    noResult.style.display = 'block';
                    pagination.innerHTML = '';
                    return;
                }
                noResult.style.display = 'none';
                resultInfo.textContent = `共 ${filtered.length} 篇文章 · 第 ${currentPage} / ${totalPages} 页`;

                articlesList.innerHTML = pageArticles.map(article => {
				    const tagsHtml = article.tags.map(t => `<span class="tag">${t}</span>`).join('');
				    const href = article.url || '#';
				    const clickAttr = article.url ? '' : ' onclick="return false;"';
				    return `
				        <a href="${href}" class="article-card"${clickAttr}>
				            <h3>${article.title}</h3>
				            <div class="subtitle">${article.subtitle}</div>
				            <div class="article-meta">
				                ${tagsHtml}
				                <span class="date">${article.date}</span>
				            </div>
				        </a>
				    `;
				}).join('');

                renderPagination(currentPage, totalPages);
            }

            function renderPagination(current, total) {
                if (total <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                const buttons = [];
                buttons.push(`<button class="page-btn arrow" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}>‹</button>`);

                const range = [];
                for (let i = 1; i <= total; i++) {
                    if (i === 1 || i === total || (i >= current - 1 && i <= current + 1)) {
                        range.push(i);
                    }
                }
                const uniqueRange = [...new Set(range)].sort((a, b) => a - b);

                let prev = 0;
                uniqueRange.forEach(page => {
                    if (prev && page - prev > 1) {
                        buttons.push('<span class="page-ellipsis">…</span>');
                    }
                    buttons.push(`<button class="page-btn ${page === current ? 'active' : ''}" data-page="${page}">${page}</button>`);
                    prev = page;
                });

                buttons.push(`<button class="page-btn arrow" data-page="${current + 1}" ${current === total ? 'disabled' : ''}>›</button>`);
                pagination.innerHTML = buttons.join('');
            }

            searchInput.addEventListener('input', () => {
                searchText = searchInput.value;
                currentPage = 1;
                renderArticles();
            });

            tagsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.tag-btn');
                if (!btn) return;
                tagsContainer.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTag = btn.dataset.tag;
                currentPage = 1;
                renderArticles();
            });

            pagination.addEventListener('click', (e) => {
                const btn = e.target.closest('.page-btn');
                if (!btn || btn.disabled) return;
                const page = parseInt(btn.dataset.page, 10);
                if (isNaN(page)) return;
                currentPage = page;
                renderArticles();
                const listTop = articlesList.getBoundingClientRect().top + window.scrollY - 100;
                window.scrollTo({ top: listTop, behavior: 'smooth' });
            });

            function updateNavbar() {
                const scrollY = window.scrollY;
                navbar.classList.toggle('scrolled', scrollY > 50);
                backToTop.classList.toggle('visible', scrollY > 500);
            }
            window.addEventListener('scroll', updateNavbar, { passive: true });

            navToggle.addEventListener('click', () => {
                navLinks.classList.contains('open') ? closeMobileNav() : openMobileNav();
            });
            navOverlay.addEventListener('click', closeMobileNav);
            function openMobileNav() {
                navLinks.classList.add('open');
                navOverlay.classList.add('active');
                navToggle.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closeMobileNav() {
                navLinks.classList.remove('open');
                navOverlay.classList.remove('active');
                navToggle.classList.remove('active');
                document.body.style.overflow = '';
            }
            navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileNav));

            backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });
            fadeElements.forEach(el => observer.observe(el));

            renderTags();
            renderArticles();
            updateNavbar();
        })();
    </script>
</body>
</html>
